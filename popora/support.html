<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>고객지원 · POPORA</title><meta name="description" content="동물구조대와 포포라. ANSHIN LABS의 게임과 고객지원 안내를 만나보세요."><meta name="theme-color" content="#f8f7f1"><meta property="og:title" content="고객지원 · POPORA"><meta property="og:description" content="Little friends. Big adventures. Meet the games of ANSHIN LABS."><meta property="og:type" content="website"><meta property="og:image" content="https://anshin-labs.com/assets/popora-world.webp"><meta property="og:url" content="https://anshin-labs.com/popora/support.html"><link rel="canonical" href="https://anshin-labs.com/popora/support.html"><link rel="icon" href="../assets/studio-mark.svg" type="image/svg+xml"><link rel="stylesheet" href="../site.css"><script defer src="../popora/support.js"></script><script type="application/json" id="support-copy">{"ko": ["한국어", "고객지원", "계정 삭제", "개인정보 처리방침", "POPORA · 노모 군단", "도움이 필요하신가요?", "계정, 저장 복구, 구매 또는 오류에 대해 문의해 주세요. 설정 맨 아래의 유저 ID와 기기 종류를 알려주시면 확인에 도움이 됩니다. 비밀번호·인증번호·결제 카드 번호는 보내지 마세요.", "이메일로 문의", "계정 및 데이터 삭제 요청", "게임 설정 → 계정 삭제에서 직접 삭제할 수 있습니다. Apple·Google로 연결했다면 같은 계정으로 본인 확인합니다. 두 제공자 모두 연결했다면 각각 확인합니다.", "앱을 사용할 수 없어도 아래 이메일로 삭제를 요청할 수 있습니다. 유저 ID를 알고 있다면 함께 보내 주세요. 연결에 사용한 이메일로 보내면 본인 확인에 도움이 됩니다. 운영자가 계정 소유를 확인한 뒤 처리합니다. ID만으로 타인의 계정을 삭제하지 않습니다.", "진행도, 코인·재료, 병사·영웅, 마을, 프로필 그림, 작성한 채팅, 랭킹 및 계정 연결 정보가 삭제됩니다. 부족에서 탈퇴하며 부족장은 승계됩니다. 복구할 수 없습니다. Apple·Google 계정 자체는 삭제하지 않으며 스토어 환불은 별도입니다.", "재지급 방지용 익명 구매 식별 해시와 익명 삭제 완료 영수증은 보관됩니다. 서비스 제공자의 백업은 해당 보관 정책에 따라 만료됩니다.", "삭제 요청 이메일 작성", "수집 및 이용", "계정 연결 시 제공자가 전달하는 계정 식별자·이메일, 게임 진행도·재화·구매 식별자, 직접 입력한 닉네임·그림·채팅을 저장합니다. 로그인·기록 복구·게임 기능·보상 검증·부정 이용 방지·고객지원에 사용합니다. 결제 카드 정보는 앱이 보관하지 않습니다.", "공개 범위", "월드·부족 채팅, 닉네임, 깃발 그림, 랭킹 및 부족전 정보는 해당 기능의 다른 이용자에게 보일 수 있습니다. 건의는 작성자와 운영자만 볼 수 있습니다.", "서비스 제공자와 광고", "Supabase는 인증과 서버 저장을 처리합니다. Apple·Google은 로그인과 스토어 결제를 처리합니다. Google AdMob·UMP는 광고, 동의 설정, 광고 측정 및 부정 이용 방지를 위해 기기·광고 식별자, IP 주소, 사용·진단 정보를 처리할 수 있습니다. iOS 추적 권한과 제공되는 광고 개인정보 설정으로 선택을 관리할 수 있습니다. 제공자 서버는 다른 국가에 위치할 수 있습니다.", "보관 및 선택", "계정 유지 중 게임 제공에 필요한 기록을 보관합니다. 계정 삭제 시 위 범위대로 처리하며 구매 재사용 방지용 익명 해시는 남깁니다. 제공자 보관 정책은 아래 링크에서 확인할 수 있습니다. 개인정보 문의와 삭제 요청은 고객지원으로 보내 주세요.", "계정 삭제 안내", "마지막 수정: 2026-10-11"], "en": ["English", "Support", "Delete account", "Privacy policy", "POPORA · NOMO Legion", "Need help?", "Contact us about accounts, save recovery, purchases or errors. Include your user ID from the bottom of Settings and your device type if available. Never send passwords, verification codes or payment card numbers.", "Email support", "Request account and data deletion", "In the game, open Settings → Delete account. Verify the same linked Apple or Google account. If both providers are linked, verify each one.", "You can also request deletion by email without the app. Include your user ID if known. Writing from the email used to link the account helps us verify ownership. Support processes the request after verifying ownership; a user ID alone does not authorize deletion.", "Progress, coins and materials, soldiers and heroes, village, profile drawings, authored chats, rankings and account links are deleted. You leave your tribe and leadership passes to a remaining member. This cannot be undone. Your Apple or Google account itself is not deleted. Store refunds are separate.", "Anonymous purchase identifier hashes preventing duplicate rewards and anonymous deletion receipts are retained. Service provider backups expire under their retention policies.", "Write deletion request", "Data and purposes", "We store account identifiers and email provided when you link an account; game progress, currencies and purchase identifiers; and nicknames, drawings and chats you submit. We use these for sign-in, save recovery, gameplay, reward verification, abuse prevention and support. The app does not store payment card details.", "Visibility", "World and tribe chats, nicknames, flag drawings, rankings and tribal war information may be visible to other users of those features. Suggestions are visible only to their author and operators.", "Providers and ads", "Supabase handles authentication and server storage. Apple and Google handle sign-in and store purchases. Google AdMob and UMP may process device and advertising identifiers, IP addresses, usage and diagnostic information for ads, consent, measurement and fraud prevention. Manage available choices through iOS tracking permission and ad privacy settings. Provider servers may be located in other countries.", "Retention and choices", "We keep records needed to provide the game while your account remains active. Account deletion removes the data described above, retaining anonymous purchase replay prevention hashes. Provider retention policies are linked below. Contact support with privacy questions or deletion requests.", "Deletion guide", "Updated: 2026-10-11"], "ja": ["日本語", "サポート", "アカウント削除", "プライバシーポリシー", "POPORA · ノモ軍団", "お困りですか？", "アカウント、セーブ復元、購入、不具合についてお問い合わせください。設定の最下部にあるユーザーIDと端末の種類を添えると確認に役立ちます。パスワード、認証コード、カード番号は送らないでください。", "メールで問い合わせ", "アカウントとデータの削除依頼", "ゲームの設定 → アカウント削除から削除できます。連携した同じApple・Googleアカウントで本人確認します。両方と連携している場合はそれぞれ確認します。", "アプリが使えなくてもメールで削除を依頼できます。分かる場合はユーザーIDを添えてください。連携に使用したメールから送信すると本人確認に役立ちます。運営が所有者を確認した後に処理します。IDだけでは他人のアカウントを削除しません。", "進行状況、コイン・素材、兵士・英雄、村、プロフィールの絵、投稿したチャット、ランキング、連携情報を削除します。部族を脱退し、族長は残るメンバーへ引き継がれます。復元できません。Apple・Googleアカウント自体は削除されません。返金はストアで別途申請してください。", "二重付与を防ぐ匿名の購入識別ハッシュと匿名の削除完了記録は保持します。提供事業者のバックアップは各社の保持方針に従い期限が切れます。", "削除依頼メールを作成", "データと利用目的", "連携時に提供されるアカウント識別子・メール、進行状況・通貨・購入識別子、入力した名前・絵・チャットを保存します。ログイン、復元、ゲーム提供、報酬検証、不正防止、サポートに使用します。アプリはカード情報を保存しません。", "公開範囲", "ワールド・部族チャット、名前、旗の絵、ランキング、部族戦情報は各機能の他の利用者に表示される場合があります。ご意見は投稿者と運営だけが閲覧できます。", "事業者と広告", "Supabaseは認証とサーバー保存を、Apple・Googleはログインとストア決済を処理します。Google AdMob・UMPは広告、同意、測定、不正防止のため端末・広告識別子、IPアドレス、利用・診断情報を処理する場合があります。iOSの追跡許可と広告プライバシー設定で選択を管理できます。サーバーが国外に置かれる場合があります。", "保存と選択", "アカウント利用中はゲーム提供に必要な記録を保存します。削除時は上記範囲を消去し、購入の再利用防止用匿名ハッシュを保持します。各事業者の保持方針は下記リンクをご覧ください。個人情報や削除についてはサポートにご連絡ください。", "削除ガイド", "更新日: 2026-10-11"], "zh-Hant": ["繁體中文", "支援", "刪除帳號", "隱私權政策", "POPORA · 諾莫軍團", "需要協助嗎？", "帳號、存檔還原、購買或錯誤問題皆可聯絡我們。請盡可能附上設定底部的使用者 ID 和裝置類型。切勿傳送密碼、驗證碼或付款卡號。", "寄信聯絡支援", "申請刪除帳號及資料", "在遊戲中開啟設定 → 刪除帳號。請驗證原先連結的 Apple 或 Google 帳號。若兩者皆已連結，請依序驗證。", "無法使用遊戲時，也能透過電子郵件申請刪除。若知道使用者 ID，請一併提供。使用連結帳號的信箱寄信有助確認身分。客服會先驗證帳號所有權再處理，僅憑 ID 無法刪除他人的帳號。", "進度、金幣與素材、士兵與英雄、村莊、個人繪圖、發送的聊天、排名與帳號連結將被刪除。您將退出部落，首領由其他成員接任。資料無法復原。Apple 或 Google 帳號本身不會被刪除，商店退款需另外申請。", "為防止重複獎勵，匿名購買識別雜湊及匿名刪除完成紀錄會保留。服務供應商的備份會依其保留政策到期。", "撰寫刪除申請信", "資料與用途", "我們保存連結帳號時提供的識別碼與電子郵件、遊戲進度、貨幣、購買識別碼，以及您提交的暱稱、繪圖與聊天。用於登入、存檔還原、遊戲功能、獎勵驗證、防止濫用與支援。遊戲不保存付款卡資料。", "可見範圍", "世界與部落聊天、暱稱、旗幟繪圖、排名及部落戰資訊可能對相關功能的其他玩家可見。建議僅作者與管理員可見。", "供應商與廣告", "Supabase 處理驗證與伺服器儲存；Apple 與 Google 處理登入與商店購買。Google AdMob 與 UMP 可能為廣告、同意、衡量及防詐騙處理裝置與廣告識別碼、IP 位址、使用與診斷資訊。可透過 iOS 追蹤權限與廣告隱私設定管理可用選項。供應商伺服器可能位於其他國家。", "保留與選擇", "帳號使用期間，我們保存提供遊戲所需的紀錄。刪除帳號時依上述範圍處理，並保留防止重複使用購買紀錄的匿名雜湊。供應商保留政策請見下方連結。如有隱私問題或刪除申請，請聯絡支援。", "刪除指南", "更新日期：2026-10-11"], "de": ["Deutsch", "Support", "Konto löschen", "Datenschutzerklärung", "POPORA · NOMO Legion", "Brauchst du Hilfe?", "Kontaktiere uns bei Fragen zu Konto, Spielstand, Käufen oder Fehlern. Nenne nach Möglichkeit deine Nutzer-ID unten in den Einstellungen und deinen Gerätetyp. Sende keine Passwörter, Bestätigungscodes oder Kartennummern.", "Support kontaktieren", "Löschung von Konto und Daten beantragen", "Öffne im Spiel Einstellungen → Konto löschen. Bestätige dasselbe verknüpfte Apple- oder Google-Konto. Bei zwei Verknüpfungen bestätige beide.", "Auch ohne App kannst du die Löschung per E-Mail beantragen. Gib deine Nutzer-ID an, falls bekannt. Die mit dem Konto verknüpfte E-Mail-Adresse erleichtert die Prüfung. Der Support prüft zuerst deine Berechtigung. Eine Nutzer-ID allein berechtigt nicht zur Löschung.", "Fortschritt, Münzen und Materialien, Soldaten und Helden, Dorf, Profilzeichnungen, eigene Chatbeiträge, Ranglisten und Kontoverknüpfungen werden gelöscht. Du verlässt den Stamm; die Führung geht an ein verbleibendes Mitglied. Dies ist nicht rückgängig zu machen. Dein Apple- oder Google-Konto selbst bleibt bestehen. Erstattungen beantragst du separat beim Store.", "Anonyme Hashwerte von Kaufkennungen gegen doppelte Belohnungen sowie anonyme Löschbestätigungen bleiben erhalten. Backups der Dienstleister laufen gemäß deren Aufbewahrungsregeln ab.", "Löschanfrage schreiben", "Daten und Zwecke", "Wir speichern beim Verknüpfen übermittelte Kontokennungen und E-Mail-Adressen, Spielfortschritt, Währungen, Kaufkennungen sowie eingereichte Namen, Zeichnungen und Chats. Dies dient Anmeldung, Wiederherstellung, Spielbetrieb, Belohnungsprüfung, Missbrauchsschutz und Support. Die App speichert keine Kartendaten.", "Sichtbarkeit", "Welt- und Stammeschats, Namen, Flaggenzeichnungen, Ranglisten und Stammeskriegsdaten können für andere Nutzer der jeweiligen Funktionen sichtbar sein. Vorschläge sehen nur Verfasser und Betreiber.", "Dienstleister und Werbung", "Supabase übernimmt Anmeldung und Serverspeicherung; Apple und Google übernehmen Anmeldung und Storekäufe. Google AdMob und UMP können Geräte- und Werbekennungen, IP-Adressen, Nutzungs- und Diagnosedaten für Werbung, Einwilligung, Messung und Betrugsschutz verarbeiten. Verfügbare Optionen verwaltest du über die iOS-Tracking-Erlaubnis und die Werbedatenschutzeinstellungen. Server können sich in anderen Ländern befinden.", "Aufbewahrung und Wahlmöglichkeiten", "Während dein Konto aktiv ist, speichern wir die für das Spiel nötigen Daten. Bei Kontolöschung entfernen wir die oben genannten Daten und behalten anonyme Hashwerte gegen erneute Kaufverwendung. Die Aufbewahrungsregeln der Anbieter sind unten verlinkt. Wende dich bei Datenschutzfragen oder Löschanfragen an den Support.", "Anleitung zur Löschung", "Aktualisiert: 2026-10-11"], "fr": ["Français", "Assistance", "Supprimer le compte", "Politique de confidentialité", "POPORA · Légion NOMO", "Besoin d’aide ?", "Contactez-nous pour les comptes, sauvegardes, achats ou erreurs. Indiquez si possible votre identifiant en bas des paramètres et votre type d’appareil. N’envoyez jamais de mot de passe, de code de vérification ni de numéro de carte.", "Contacter l’assistance", "Demander la suppression du compte et des données", "Dans le jeu, ouvrez Paramètres → Supprimer le compte. Vérifiez le même compte Apple ou Google associé. Si les deux sont liés, vérifiez chacun.", "Vous pouvez aussi demander la suppression par e-mail sans utiliser l’application. Ajoutez votre identifiant si vous le connaissez. Écrire depuis l’adresse associée facilite la vérification. L’assistance traite la demande après avoir vérifié que le compte vous appartient. Un identifiant seul ne permet pas de supprimer un compte.", "Progression, pièces, matériaux, soldats, héros, village, dessins de profil, messages rédigés, classements et liens de compte sont supprimés. Vous quittez la tribu et la direction passe à un membre restant. Cette action est irréversible. Vos comptes Apple et Google eux-mêmes ne sont pas supprimés. Les remboursements se demandent séparément au store.", "Les empreintes anonymes des identifiants d’achat empêchant les récompenses en double et les reçus anonymes de suppression sont conservés. Les sauvegardes des prestataires expirent selon leurs politiques de conservation.", "Rédiger la demande", "Données et finalités", "Nous conservons les identifiants et l’adresse e-mail fournis lors de la liaison, la progression, les monnaies et identifiants d’achat, ainsi que les pseudonymes, dessins et messages saisis. Ils servent à la connexion, à la restauration, au jeu, à la validation des récompenses, à la prévention des abus et à l’assistance. L’application ne conserve pas les données de carte bancaire.", "Visibilité", "Les discussions mondiales et de tribu, pseudonymes, drapeaux, classements et informations de guerre peuvent être visibles par les autres utilisateurs concernés. Les suggestions ne sont visibles que par leur auteur et les administrateurs.", "Prestataires et publicité", "Supabase gère l’authentification et le stockage serveur. Apple et Google gèrent la connexion et les achats. Google AdMob et UMP peuvent traiter des identifiants d’appareil et publicitaires, adresses IP, données d’utilisation et diagnostics pour la publicité, le consentement, la mesure et la prévention de la fraude. Gérez les choix disponibles via l’autorisation de suivi iOS et les paramètres de confidentialité publicitaire. Les serveurs peuvent être situés à l’étranger.", "Conservation et choix", "Nous conservons les données nécessaires au jeu pendant que votre compte reste actif. Sa suppression efface les données décrites ci-dessus, sauf les empreintes anonymes empêchant la réutilisation d’achats. Les politiques des prestataires sont liées ci-dessous. Contactez l’assistance pour toute question de confidentialité ou demande de suppression.", "Guide de suppression", "Mise à jour : 2026-10-11"], "es": ["Español", "Soporte", "Eliminar cuenta", "Política de privacidad", "POPORA · Legión NOMO", "¿Necesitas ayuda?", "Contáctanos sobre cuentas, recuperación, compras o errores. Incluye tu ID de usuario al final de Ajustes y el tipo de dispositivo, si puedes. Nunca envíes contraseñas, códigos de verificación ni números de tarjeta.", "Contactar por correo", "Solicitar la eliminación de la cuenta y los datos", "En el juego, abre Ajustes → Eliminar cuenta. Verifica la misma cuenta de Apple o Google vinculada. Si vinculaste ambas, verifica cada una.", "Puedes solicitar la eliminación por correo aunque no tengas la aplicación. Incluye tu ID si lo conoces. Escribir desde el correo vinculado facilita verificar la titularidad. Soporte procesa la solicitud tras verificar que eres el titular; el ID por sí solo no autoriza la eliminación.", "Se eliminan el progreso, monedas, materiales, soldados, héroes, aldea, dibujos de perfil, mensajes escritos, clasificaciones y vínculos de cuenta. Sales de la tribu y el liderazgo pasa a otro miembro. Es irreversible. No se elimina tu cuenta de Apple o Google. Los reembolsos se solicitan por separado en la tienda.", "Se conservan hashes anónimos de identificadores de compra para evitar recompensas duplicadas y comprobantes anónimos de eliminación. Las copias de los proveedores caducan según sus políticas de conservación.", "Escribir solicitud", "Datos y fines", "Guardamos identificadores y correo facilitados al vincular la cuenta, progreso, monedas, identificadores de compra y los nombres, dibujos y mensajes que envías. Se utilizan para iniciar sesión, recuperar partidas, jugar, verificar recompensas, prevenir abusos y prestar soporte. La aplicación no guarda datos de tarjetas.", "Visibilidad", "Los chats mundiales y de tribu, nombres, banderas, clasificaciones y datos de guerra pueden ser visibles para otros usuarios de esas funciones. Las sugerencias solo son visibles para su autor y los operadores.", "Proveedores y anuncios", "Supabase gestiona la autenticación y el almacenamiento. Apple y Google gestionan el inicio de sesión y las compras. Google AdMob y UMP pueden procesar identificadores de dispositivo y publicidad, direcciones IP y datos de uso y diagnóstico para anuncios, consentimiento, medición y prevención del fraude. Gestiona las opciones disponibles mediante el permiso de seguimiento de iOS y los ajustes de privacidad publicitaria. Los servidores pueden estar en otros países.", "Conservación y opciones", "Conservamos los datos necesarios para ofrecer el juego mientras la cuenta esté activa. Al eliminarla se borran los datos descritos, conservando hashes anónimos para evitar reutilizar compras. Las políticas de los proveedores se enlazan abajo. Contacta con soporte para dudas de privacidad o solicitudes de eliminación.", "Guía de eliminación", "Actualizado: 2026-10-11"], "pt-BR": ["Português (Brasil)", "Suporte", "Excluir conta", "Política de privacidade", "POPORA · Legião NOMO", "Precisa de ajuda?", "Fale conosco sobre contas, recuperação, compras ou erros. Inclua seu ID no fim das Configurações e o tipo de dispositivo, se possível. Nunca envie senhas, códigos de verificação ou números de cartão.", "Enviar e-mail", "Solicitar exclusão da conta e dos dados", "No jogo, abra Configurações → Excluir conta. Verifique a mesma conta Apple ou Google vinculada. Se ambas estiverem vinculadas, verifique cada uma.", "Você também pode solicitar a exclusão por e-mail sem o aplicativo. Inclua seu ID, se souber. Enviar pelo e-mail vinculado facilita a verificação. O suporte processa a solicitação após confirmar a titularidade; apenas o ID não autoriza a exclusão.", "Progresso, moedas, materiais, soldados, heróis, vila, desenhos de perfil, mensagens escritas, classificações e vínculos são excluídos. Você sai da tribo e a liderança passa para outro membro. Isso é irreversível. Sua conta Apple ou Google não é excluída. Reembolsos devem ser solicitados separadamente à loja.", "Hashes anônimos de identificadores de compra contra recompensas duplicadas e comprovantes anônimos de exclusão são mantidos. Backups dos provedores expiram conforme suas políticas de retenção.", "Escrever solicitação", "Dados e finalidades", "Armazenamos identificadores e e-mail fornecidos ao vincular a conta, progresso, moedas, identificadores de compra e nomes, desenhos e mensagens enviados. Usamos esses dados para login, recuperação, jogo, verificação de recompensas, prevenção de abusos e suporte. O aplicativo não armazena dados de cartão.", "Visibilidade", "Chats mundiais e de tribo, nomes, bandeiras, classificações e informações de guerra podem ser vistos por outros usuários dessas funções. Sugestões são visíveis apenas ao autor e aos operadores.", "Provedores e anúncios", "Supabase gerencia autenticação e armazenamento. Apple e Google gerenciam login e compras. Google AdMob e UMP podem processar identificadores de dispositivo e publicidade, endereços IP e dados de uso e diagnóstico para anúncios, consentimento, medição e prevenção de fraudes. Gerencie as opções disponíveis pela permissão de rastreamento do iOS e pelas configurações de privacidade de anúncios. Os servidores podem estar em outros países.", "Retenção e escolhas", "Mantemos os registros necessários para o jogo enquanto sua conta estiver ativa. A exclusão remove os dados descritos, mantendo hashes anônimos contra reutilização de compras. As políticas dos provedores estão nos links abaixo. Contate o suporte sobre privacidade ou exclusão.", "Guia de exclusão", "Atualizado: 2026-10-11"], "id": ["Bahasa Indonesia", "Dukungan", "Hapus akun", "Kebijakan privasi", "POPORA · Legiun NOMO", "Perlu bantuan?", "Hubungi kami tentang akun, pemulihan, pembelian, atau kesalahan. Sertakan ID pengguna di bagian bawah Pengaturan dan jenis perangkat jika tersedia. Jangan kirim kata sandi, kode verifikasi, atau nomor kartu.", "Email dukungan", "Minta penghapusan akun dan data", "Di dalam game, buka Pengaturan → Hapus akun. Verifikasi akun Apple atau Google tertaut yang sama. Jika keduanya ditautkan, verifikasi masing-masing.", "Anda juga dapat meminta penghapusan melalui email tanpa aplikasi. Sertakan ID pengguna jika diketahui. Mengirim dari email yang ditautkan membantu verifikasi. Dukungan memproses permintaan setelah memastikan kepemilikan; ID saja tidak mengizinkan penghapusan.", "Progres, koin, bahan, prajurit, pahlawan, desa, gambar profil, pesan yang ditulis, peringkat, dan tautan akun dihapus. Anda keluar dari suku dan kepemimpinan diteruskan ke anggota lain. Tindakan ini tidak dapat dibatalkan. Akun Apple atau Google Anda sendiri tidak dihapus. Pengembalian dana diajukan terpisah ke toko.", "Hash anonim pengenal pembelian untuk mencegah hadiah ganda dan tanda terima penghapusan anonim tetap disimpan. Cadangan penyedia layanan kedaluwarsa menurut kebijakan retensinya.", "Tulis permintaan", "Data dan tujuan", "Kami menyimpan pengenal akun dan email saat penautan, progres, mata uang, pengenal pembelian, serta nama, gambar, dan pesan yang Anda kirim. Data digunakan untuk login, pemulihan, permainan, verifikasi hadiah, pencegahan penyalahgunaan, dan dukungan. Aplikasi tidak menyimpan data kartu.", "Visibilitas", "Obrolan dunia dan suku, nama, gambar bendera, peringkat, serta informasi perang dapat terlihat oleh pengguna fitur tersebut. Saran hanya terlihat oleh penulis dan pengelola.", "Penyedia dan iklan", "Supabase menangani autentikasi dan penyimpanan server. Apple dan Google menangani login serta pembelian. Google AdMob dan UMP dapat memproses pengenal perangkat dan iklan, alamat IP, data penggunaan dan diagnostik untuk iklan, persetujuan, pengukuran, serta pencegahan penipuan. Kelola pilihan melalui izin pelacakan iOS dan pengaturan privasi iklan yang tersedia. Server penyedia dapat berada di negara lain.", "Retensi dan pilihan", "Kami menyimpan catatan yang diperlukan selama akun aktif. Penghapusan akun menghapus data di atas, dengan menyimpan hash anonim pencegah penggunaan ulang pembelian. Kebijakan penyedia ditautkan di bawah. Hubungi dukungan tentang privasi atau penghapusan.", "Panduan penghapusan", "Diperbarui: 2026-10-11"], "th": ["ไทย", "ฝ่ายสนับสนุน", "ลบบัญชี", "นโยบายความเป็นส่วนตัว", "POPORA · กองทัพโนโม", "ต้องการความช่วยเหลือ?", "ติดต่อเราเกี่ยวกับบัญชี การกู้คืนข้อมูล การซื้อ หรือข้อผิดพลาด หากทำได้ โปรดแนบ ID ผู้ใช้จากด้านล่างของการตั้งค่าและชนิดอุปกรณ์ ห้ามส่งรหัสผ่าน รหัสยืนยัน หรือหมายเลขบัตร", "ส่งอีเมลติดต่อ", "ขอลบบัญชีและข้อมูล", "ในเกม เปิดการตั้งค่า → ลบบัญชี ยืนยันบัญชี Apple หรือ Google เดิมที่เชื่อมไว้ หากเชื่อมทั้งสองบัญชี ให้ยืนยันแต่ละบัญชี", "แม้ไม่มีแอปก็ขอลบทางอีเมลได้ โปรดระบุ ID ผู้ใช้หากทราบ การส่งจากอีเมลที่เชื่อมไว้ช่วยยืนยันตัวตน ฝ่ายสนับสนุนจะตรวจสอบเจ้าของบัญชีก่อนดำเนินการ ID เพียงอย่างเดียวไม่อนุญาตให้ลบบัญชี", "ความคืบหน้า เหรียญ วัสดุ ทหาร ฮีโร่ หมู่บ้าน ภาพโปรไฟล์ ข้อความที่เขียน อันดับ และการเชื่อมบัญชีจะถูกลบ คุณจะออกจากเผ่าและส่งต่อหัวหน้าให้สมาชิกที่เหลือ ไม่สามารถกู้คืนได้ บัญชี Apple หรือ Google เองจะไม่ถูกลบ การคืนเงินต้องขอผ่านร้านค้าแยกต่างหาก", "จะเก็บค่าแฮชแบบไม่ระบุตัวตนของรหัสการซื้อเพื่อป้องกันรางวัลซ้ำและหลักฐานการลบแบบไม่ระบุตัวตน สำเนาสำรองของผู้ให้บริการหมดอายุตามนโยบายการเก็บข้อมูลของผู้ให้บริการ", "เขียนคำขอลบ", "ข้อมูลและวัตถุประสงค์", "เราเก็บรหัสบัญชีและอีเมลที่ได้รับเมื่อเชื่อมบัญชี ความคืบหน้า สกุลเงิน รหัสการซื้อ รวมถึงชื่อ ภาพ และแชตที่ส่ง ใช้สำหรับเข้าสู่ระบบ กู้คืนข้อมูล เล่นเกม ตรวจสอบรางวัล ป้องกันการใช้งานผิด และช่วยเหลือ แอปไม่เก็บข้อมูลบัตรชำระเงิน", "การมองเห็น", "แชตโลกและเผ่า ชื่อ รูปธง อันดับ และข้อมูลสงครามอาจแสดงแก่ผู้ใช้ฟังก์ชันนั้น ข้อเสนอแนะมองเห็นได้เฉพาะผู้เขียนและผู้ดูแล", "ผู้ให้บริการและโฆษณา", "Supabase จัดการการยืนยันตัวตนและข้อมูลเซิร์ฟเวอร์ Apple และ Google จัดการการเข้าสู่ระบบและการซื้อ Google AdMob และ UMP อาจประมวลผลรหัสอุปกรณ์และโฆษณา ที่อยู่ IP ข้อมูลการใช้งานและวินิจฉัย เพื่อโฆษณา ความยินยอม การวัดผล และป้องกันการฉ้อโกง จัดการตัวเลือกผ่านสิทธิ์ติดตาม iOS และการตั้งค่าความเป็นส่วนตัวของโฆษณาที่มี เซิร์ฟเวอร์อาจอยู่ต่างประเทศ", "การเก็บข้อมูลและทางเลือก", "เราเก็บข้อมูลที่จำเป็นขณะบัญชียังใช้งาน การลบบัญชีจะลบข้อมูลตามข้างต้น โดยเก็บแฮชไม่ระบุตัวตนเพื่อป้องกันการใช้รายการซื้อซ้ำ ดูนโยบายผู้ให้บริการจากลิงก์ด้านล่าง ติดต่อฝ่ายสนับสนุนเรื่องความเป็นส่วนตัวหรือการลบ", "คู่มือการลบ", "อัปเดต: 2026-10-11"]}</script></head><body data-page="support"><header class="header wrap"><a href="../index.html" aria-label="ANSHIN LABS"><span class="brand"><svg viewBox="0 0 36 42" fill="none" aria-hidden="true"><path d="M4 35V17a14 14 0 0 1 28 0v18" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M4 25h28M14 35h8" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg><span>ANSHIN<small>LABS</small></span></span></a><select id="support-language" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh-Hant">繁體中文</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="es">Español</option><option value="pt-BR">Português (Brasil)</option><option value="id">Bahasa Indonesia</option><option value="th">ไทย</option></select></header><nav class="legal-tabs wrap" aria-label="POPORA"><a href="./">POPORA</a><a href="support.html" data-support-nav="1">고객지원</a><a href="delete-account.html" data-support-nav="2">계정 삭제</a><a href="privacy.html" data-support-nav="3">개인정보처리방침</a></nav><main id="main" class="legal-main wrap"><p class="legal-kicker">POPORA · ANSHIN LABS</p><h1>고객지원</h1><div id="support-content"><h2>도움이 필요하신가요?</h2><p>계정, 저장 복구, 구매 또는 오류에 대해 문의해 주세요. 설정 맨 아래의 유저 ID와 기기 종류를 알려주시면 확인에 도움이 됩니다. 비밀번호·인증번호·결제 카드 번호는 보내지 마세요.</p><a href="mailto:info@anshin-labs.com?subject=POPORA%20%E2%80%94%20%EA%B3%A0%EA%B0%9D%EC%A7%80%EC%9B%90">이메일로 문의</a><p><a href="mailto:info@anshin-labs.com?subject=POPORA%20%E2%80%94%20%EA%B3%A0%EA%B0%9D%EC%A7%80%EC%9B%90">info@anshin-labs.com</a></p><a href="delete-account.html?lang=ko">계정 삭제 안내 →</a></div></main><footer class="footer wrap"><span>ANSHIN LABS · POPORA</span><a href="mailto:info@anshin-labs.com">info@anshin-labs.com</a><span>© 2026 anshin-labs</span></footer></body></html>
